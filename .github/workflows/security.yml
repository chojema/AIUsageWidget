name: Public repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject ignored files in version control
        shell: bash
        run: |
          set +e
          git ls-files -z | git check-ignore --no-index --stdin -z > "$RUNNER_TEMP/ignored-tracked-files"
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "::error::Private or generated files covered by .gitignore are tracked. Review the publication contents."
            exit 1
          elif [ "$result" -ne 1 ]; then
            exit "$result"
          fi

      - name: Install a checksum-verified scanner
        shell: bash
        env:
          SCANNER_VERSION: 8.30.1
          SCANNER_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner_dir"
          archive="$scanner_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${SCANNER_VERSION}/gitleaks_${SCANNER_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$SCANNER_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$scanner_dir" gitleaks

      - name: Scan all fetched Git history with redacted output
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="--all" --redact --no-banner --ignore-gitleaks-allow
